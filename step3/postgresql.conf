# general

listen_addresses = '*'
dynamic_shared_memory_type = posix

# performance

work_mem = 256MB
shared_buffers = 128MB

# reduce WAL and archiving

checkpoint_timeout=1d
max_wal_size = 64MB
min_wal_size = 32MB
wal_level = minimal
max_wal_senders = 0
wal_buffers = -1
archive_mode = off
archive_command = '/bin/true'

# locale settings

log_timezone = 'Etc/UTC'
datestyle = 'iso, mdy'
timezone = 'Etc/UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'

